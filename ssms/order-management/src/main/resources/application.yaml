server:
  port: 8084

spring:
  application:
    name: order-management
  datasource:
    url: jdbc:postgresql://localhost:5432/ssms_order
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    com.ssms.ordermanagement: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG

