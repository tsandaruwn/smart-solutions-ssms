spring:
  application:
    name: product-management-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ssms_product
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: 8082

logging:
  level:
    org.springframework.web: INFO
    org.hibernate: INFO

