server:
  port: 8086

spring:
  application:
    name: payment-management
    
  datasource:
    url: jdbc:postgresql://localhost:5432/ssms_payment
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
